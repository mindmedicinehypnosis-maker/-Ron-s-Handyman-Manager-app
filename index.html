<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ron's Handyman Services Manager</title><style>:root{font-family:system-ui,Arial;background:#f3f6fa;color:#14253b}*{box-sizing:border-box}body{margin:0}header{background:#123454;color:white;padding:18px}h1{font-size:21px;margin:0}header p{margin:5px 0 0}nav{display:flex;overflow:auto;background:white;border-bottom:1px solid #ddd;position:sticky;top:0}nav button{border:0;background:white;padding:15px;white-space:nowrap;font-weight:600;color:#234}nav button.active{background:#d9e9ff}main{max-width:1050px;margin:auto;padding:16px}.panel{background:white;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 1px 5px #0001}input,select,textarea{width:100%;padding:11px;margin:5px 0 11px;border:1px solid #b8c5d3;border-radius:7px;font:inherit}label{font-weight:600;font-size:13px}button.primary{background:#1263a2;color:white;border:0;padding:12px 17px;border-radius:8px;font-weight:700}button.small{padding:7px;border:1px solid #bbb;background:#fff;border-radius:6px;margin:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.muted{color:#607082;font-size:13px}.item{border-top:1px solid #e5e9ef;padding:12px 0}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #ddd} .scroll{overflow:auto} .danger{color:#9c1d1d} .notice{background:#fff4d6;padding:12px;border-radius:8px;font-size:13px}</style></head><body><header><h1>🔧 Ron's Handyman Services Manager</h1><p>Business dashboard · Local demo</p></header><nav id="nav"></nav><main><div class="notice">This first version saves data in this browser only. It is not yet a secure multi-user app. Do not enter sensitive customer or employee information until online accounts and backups are configured.</div><section id="view"></section></main><script>
const tabs=['Dashboard','Customers','Jobs','Expenses','Payments','Employees','Time Clock','Approvals','Backup'];let tab='Dashboard';let data;try{data=JSON.parse(localStorage.getItem('rhsm_v1'))||{customers:[],jobs:[],expenses:[],payments:[],employees:[],time:[]}}catch(e){data={customers:[],jobs:[],expenses:[],payments:[],employees:[],time:[]}};const save=()=>{localStorage.setItem('rhsm_v1',JSON.stringify(data));render()};const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toFixed(2);const name=(arr,i)=>arr.find(x=>x.id===i)?.name||'Unassigned';const opts=(arr)=>arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.title)}</option>`).join('');const form=(fields,action,button='Save')=>`<form data-action="${action}"><div class="grid">${fields.map(f=>`<div><label>${f[1]}</label>${f[2]==='select'?`<select name="${f[0]}" ${f[4]||''}>${f[3]}</select>`:f[2]==='textarea'?`<textarea name="${f[0]}"></textarea>`:`<input name="${f[0]}" type="${f[2]||'text'}" ${f[3]||''} ${f[4]||''}>`}</div>`).join('')}</div><button class="primary">${button}</button></form>`;const jobIncome=j=>data.payments.filter(p=>p.job===j.id).reduce((s,p)=>s+ +p.amount,0);const jobCost=j=>data.expenses.filter(p=>p.job===j.id).reduce((s,p)=>s+ +p.amount,0);const hours=t=>t.end?Math.max(0,(new Date(t.end)-new Date(t.start))/3600000):(+t.manualHours||0);const approved=t=>t.status==='approved';function render(){const copt=opts(data.customers),jopt=opts(data.jobs),eopt=opts(data.employees);document.querySelector('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');let h='';if(tab==='Dashboard'){let billed=data.jobs.reduce((s,j)=>s+ +j.price,0),paid=data.payments.reduce((s,p)=>s+ +p.amount,0),cost=data.expenses.reduce((s,p)=>s+ +p.amount,0);h=`<div class="grid">${[['Customers',data.customers.length],['Jobs',data.jobs.length],['Job estimates',money(billed)],['Payments recorded',money(paid)],['Materials / expenses',money(cost)],['Estimated receivables',money(billed-paid)]].map(x=>`<div class="panel"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="panel"><h2>Upcoming jobs</h2>${data.jobs.filter(j=>j.date&&j.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(j=>`<div class="item"><b>${esc(j.title)}</b> · ${esc(j.date)} · ${esc(name(data.customers,j.customer))} · ${esc(j.status)}</div>`).join('')||'No scheduled jobs yet.'}</div>`}if(tab==='Customers'){h=`<div class="panel"><h2>Add customer</h2>${form([['name','Name','text','required'],['phone','Phone','tel'],['email','Email','email'],['address','Service address'],['notes','Notes','textarea']],'customer')}</div><div class="panel"><h2>Customers (${data.customers.length})</h2>${data.customers.map(c=>`<div class="item"><b>${esc(c.name)}</b><div>${esc(c.phone)} · ${esc(c.email)}</div><div>${esc(c.address)}</div><div class="muted">${esc(c.notes)}</div><button class="small" data-del="customers" data-id="${c.id}">Delete</button></div>`).join('')||'No customers yet.'}</div>`}if(tab==='Jobs'){h=`<div class="panel"><h2>Add / schedule job</h2>${form([['title','Job description','text','required'],['customer','Customer','select',`<option value="">Choose customer</option>${copt}`,'required'],['date','Scheduled date','date'],['status','Status','select','<option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Cancelled</option>'],['price','Quoted / billed amount ($)','number','min="0" step="0.01"'],['notes','Job notes','textarea']],'job')}</div><div class="panel"><h2>Jobs</h2>${data.jobs.map(j=>`<div class="item"><b>${esc(j.title)}</b> · ${esc(name(data.customers,j.customer))}<div>${esc(j.date||'No date')} · Estimate ${money(j.price)} · Paid ${money(jobIncome(j))} · Expenses ${money(jobCost(j))}</div><label>Status</label><select data-status="${j.id}">${['Scheduled','In Progress','Completed','Cancelled'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><div class="muted">${esc(j.notes)}</div><button class="small" data-del="jobs" data-id="${j.id}">Delete</button></div>`).join('')||'No jobs yet.'}</div>`}if(tab==='Expenses'){h=`<div class="panel"><h2>Record material / job expense</h2>${form([['job','Job','select',`<option value="">Choose job</option>${jopt}`,'required'],['description','Material or expense','text','required'],['amount','Amount ($)','number','min="0" step="0.01" required'],['date','Date','date']],'expense')}</div><div class="panel"><h2>Expenses</h2>${data.expenses.map(x=>`<div class="item">${esc(x.description)} · ${money(x.amount)} · ${esc(name(data.jobs,x.job))} · ${esc(x.date)} <button class="small" data-del="expenses" data-id="${x.id}">Delete</button></div>`).join('')||'No expenses yet.'}</div>`}if(tab==='Payments'){h=`<div class="panel"><h2>Record customer payment (no processing)</h2>${form([['job','Job','select',`<option value="">Choose job</option>${jopt}`,'required'],['amount','Amount ($)','number','min="0.01" step="0.01" required'],['method','Method','select','<option>Cash</option><option>Check</option><option>Card</option><option>ACH</option><option>Other</option>'],['date','Date','date'],['notes','Reference / notes']],'payment')}</div><div class="panel"><h2>Payments</h2>${data.payments.map(p=>`<div class="item">${money(p.amount)} · ${esc(p.method)} · ${esc(name(data.jobs,p.job))} · ${esc(p.date)} <button class="small" data-del="payments" data-id="${p.id}">Delete</button></div>`).join('')||'No payments yet.'}</div>`}if(tab==='Employees'){h=`<div class="panel"><h2>Add employee and permissions</h2>${form([['name','Employee name','text','required'],['rate','Hourly rate ($)','number','min="0" step="0.01" required'],['schedule','Pay schedule','select','<option>Biweekly</option><option>After each job</option>'],['role','Access level (planned for online version)','select','<option>Employee</option><option>Trusted Employee</option><option>Manager</option>'],['canSchedule','Can schedule jobs?','select','<option value="no">No</option><option value="yes">Yes</option>'],['canAddCustomers','Can add customers?','select','<option value="no">No</option><option value="yes">Yes</option>']],'employee')}</div><div class="panel"><h2>Employees</h2>${data.employees.map(e=>{let owed=data.time.filter(t=>t.employee===e.id&&approved(t)).reduce((s,t)=>s+hours(t)* +e.rate,0);return `<div class="item"><b>${esc(e.name)}</b> · ${esc(e.role)} · ${money(e.rate)}/hr · ${esc(e.schedule)}<div>Approved gross wages: ${money(owed)} · Recorded wage payments: ${money((e.wagePayments||[]).reduce((s,p)=>s+ +p.amount,0))} · Balance: ${money(owed-(e.wagePayments||[]).reduce((s,p)=>s+ +p.amount,0))}</div><div class="muted">Schedule jobs: ${esc(e.canSchedule)} · Add customers: ${esc(e.canAddCustomers)}</div><button class="small" data-del="employees" data-id="${e.id}">Delete</button></div>`}).join('')||'No employees yet.'}</div><div class="panel"><h2>Mark employee wages paid</h2>${form([['employee','Employee','select',`<option value="">Choose employee</option>${eopt}`,'required'],['amount','Payment amount','number','min="0.01" step="0.01" required'],['method','Method','select','<option>Cash</option><option>Check</option><option>Electronic</option>'],['date','Payment date','date']],'wagepayment','Mark as Paid')}</div>`}if(tab==='Time Clock'){h=`<div class="panel"><h2>Clock in</h2>${form([['employee','Employee','select',`<option value="">Choose employee</option>${eopt}`,'required'],['job','Job','select',`<option value="">Choose job</option>${jopt}`,'required']],'clockin','Clock In')}</div><div class="panel"><h2>Submit missed hours for owner approval</h2>${form([['employee','Employee','select',`<option value="">Choose employee</option>${eopt}`,'required'],['job','Job','select',`<option value="">Choose job</option>${jopt}`,'required'],['date','Work date','date','required'],['manualHours','Hours worked','number','min="0.01" step="0.01" required'],['notes','Reason / notes','textarea']],'manualtime','Submit for Approval')}</div><div class="panel"><h2>Time entries</h2>${data.time.map(t=>`<div class="item"><b>${esc(name(data.employees,t.employee))}</b> · ${esc(name(data.jobs,t.job))} · ${hours(t).toFixed(2)} hours · ${esc(t.status)}<div class="muted">${esc(t.date||t.start)} ${esc(t.notes||'')}</div>${t.start&&!t.end?`<button class="small" data-clockout="${t.id}">Clock Out</button>`:''}</div>`).join('')||'No time entries yet.'}</div>`}if(tab==='Approvals'){h=`<div class="panel"><h2>Owner time approvals</h2>${data.time.filter(t=>t.status==='pending').map(t=>`<div class="item"><b>${esc(name(data.employees,t.employee))}</b> · ${esc(name(data.jobs,t.job))} · ${hours(t).toFixed(2)} hours <div>${esc(t.date||'')} · ${esc(t.notes||'')}</div><button class="small" data-approve="${t.id}">Approve</button><button class="small danger" data-reject="${t.id}">Reject</button></div>`).join('')||'No pending requests.'}</div>`}if(tab==='Backup'){h=`<div class="panel"><h2>Export backup</h2><p>Save your data to a JSON file. This demo has no cloud backup, so export regularly.</p><button class="primary" id="export">Download Backup</button></div><div class="panel"><h2>Restore backup</h2><input type="file" id="import" accept="application/json"><p class="muted">Restoring replaces all current demo data.</p></div>`}document.querySelector('#view').innerHTML=h}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.del){if(confirm('Delete this record? Related records will not be automatically deleted.')){data[b.dataset.del]=data[b.dataset.del].filter(x=>x.id!==b.dataset.id);save()}}if(b.dataset.clockout){let t=data.time.find(x=>x.id===b.dataset.clockout);t.end=new Date().toISOString();t.status='pending';save()}if(b.dataset.approve){data.time.find(x=>x.id===b.dataset.approve).status='approved';save()}if(b.dataset.reject){data.time.find(x=>x.id===b.dataset.reject).status='rejected';save()}if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='rons-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('change',async e=>{if(e.target.dataset.status){data.jobs.find(j=>j.id===e.target.dataset.status).status=e.target.value;save()}if(e.target.id==='import'){try{let d=JSON.parse(await e.target.files[0].text());if(!['customers','jobs','expenses','payments','employees','time'].every(k=>Array.isArray(d[k])))throw Error('Invalid backup');if(confirm('Replace current data with this backup?')){data=d;save()}}catch(err){alert('Could not restore: '+err.message)}}});document.addEventListener('submit',e=>{let f=e.target.closest('form[data-action]');if(!f)return;e.preventDefault();let v=Object.fromEntries(new FormData(f));let action=f.dataset.action;if(action==='clockin'){if(data.time.some(t=>t.employee===v.employee&&!t.end&&t.start)){alert('Employee already clocked in.');return}data.time.push({...v,id:id(),start:new Date().toISOString(),end:null,status:'open'})}else if(action==='manualtime'){data.time.push({...v,id:id(),status:'pending'})}else if(action==='wagepayment'){let employee=data.employees.find(x=>x.id===v.employee);employee.wagePayments??=[];employee.wagePayments.push({...v,id:id()})}else{let key={customer:'customers',job:'jobs',expense:'expenses',payment:'payments',employee:'employees'}[action];data[key].push({...v,id:id()})}save()});render();</script></body></html>
